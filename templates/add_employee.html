{% extends "base.html" %}

{% block page_title %}신규 직원 등록{% endblock %}

{% block custom_styles %}
<style>
    /* 이 페이지 전용 레이아웃 (화면 꽉 채우기) */
    .content-grid {
        grid-template-rows: 100%;
        padding-bottom: 0;
        overflow: hidden;
    }
</style>
{% endblock %}

{% block page_content %}

<div class="card" style="grid-column: 1 / 3; height: 100%; display: flex; flex-direction: column;">
    <div class="card-header">신규 직원 정보 입력</div>
    
    <div class="card-body" style="flex-grow: 1; overflow-y: auto; padding: 20px;">
        
        <form method="POST" action="{{ url_for('add_employee') }}" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="profile_image">프로필 사진</label>
                <input type="file" id="profile_image" name="profile_image" accept="image/*">
            </div>

            <div class="form-group">
                <label for="department">부서</label>
                <select id="department" name="department" required>
                    <option value="">-- 부서 선택 --</option>
                    {% for dept in departments %}<option value="{{ dept['name'] }}">{{ dept['name'] }}</option>{% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="position">직급</label>
                <select id="position" name="position" required>
                    <option value="">-- 직급 선택 --</option>
                    {% for pos in positions %}<option value="{{ pos['name'] }}">{{ pos['name'] }}</option>{% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="birth_date">생년월일</label>
                <input type="date" id="birth_date" name="birth_date" required>
            </div>

            <div class="form-group">
                <label for="hire_date">입사일</label>
                <input type="date" id="hire_date" name="hire_date" required>
            </div>

            <div class="form-group">
                <label>연락처</label>
                <div class="phone-group">
                    <input type="tel" name="phone1" maxlength="3" required> -
                    <input type="tel" name="phone2" maxlength="4" required> -
                    <input type="tel" name="phone3" maxlength="4" required>
                </div>
            </div>

            <div class="form-group">
                <label>이메일</label>
                <div class="email-group">
                    <input type="text" name="email_id" required> @
                    <select name="email_domain" required>
                        {% for domain in email_domains %}<option value="{{ domain['domain'] }}">{{ domain['domain'] }}</option>{% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="address">주소</label>
                <input type="text" id="address" name="address">
            </div>

            <div class="form-group">
                <label>급여 계좌 (은행 / 계좌번호)</label>
                <div style="display: flex; gap: 10px;">
                    <select name="bank_name" style="width: 130px; flex-shrink: 0; text-align: center; text-align-last: center;">
                        <option value="" style="text-align: center;">-- 은행 --</option>
                        <option value="국민은행" style="text-align: left; padding-left: 10px;">국민</option>
                        <option value="신한은행" style="text-align: left; padding-left: 10px;">신한</option>
                        <option value="우리은행" style="text-align: left; padding-left: 10px;">우리</option>
                        <option value="하나은행" style="text-align: left; padding-left: 10px;">하나</option>
                        <option value="농협" style="text-align: left; padding-left: 10px;">농협</option>
                        <option value="카카오뱅크" style="text-align: left; padding-left: 10px;">카카오뱅크</option>
                    </select>
                    <input type="text" name="account_number" placeholder="계좌번호를 입력하세요 (하이픈 포함)" style="flex-grow: 1;">
                </div>
            </div>

            <div class="form-group">
                <label>성별</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="남성" checked> 남성</label>
                    <label><input type="radio" name="gender" value="여성"> 여성</label>
                </div>
            </div>
            <div class="form-group">
                <label>차량 소유 여부</label>
                <div style="display: flex; gap: 20px; margin-top: 5px;">
                    <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="radio" name="has_vehicle" value="1"> 
                        <span style="font-weight: bold; color: #2c3e50;">예 (자가운전보조금 지급)</span>
                    </label>
                    <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="radio" name="has_vehicle" value="0" checked> 
                        <span>아니오</span>
                    </label>
                </div>
                <small style="color: #7f8c8d;">* '예' 선택 시 월 200,000원의 자가운전보조금이 자동으로 책정됩니다.</small>
            </div>


            {% if g.user.role == 'admin' %}
            <div class="form-group">
                <label for="role">권한 (역할)</label>
                <select id="role" name="role" required>
                    <option value="user" selected>일반 사원 (user)</option>
                    <option value="admin">관리자 (admin)</option>
                </select>
            </div>
            {% endif %}

            <div class="form-actions" style="margin-top: 30px; padding-bottom: 10px;">
                <button type="submit" class="btn main-action-btn">저장하기</button>
                <a href="{{ url_for('hr_management') }}" class="btn sub-action-btn">목록으로</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
